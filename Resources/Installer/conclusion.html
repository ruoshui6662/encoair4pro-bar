<h1>安装完成</h1><p>在访达侧栏打开「应用程序」（<b>/Applications</b>），双击 <b>EncoBar</b>。连接耳机后，点击菜单栏耳机图标使用。</p>
<p>卸载入口：耳机面板「…」→「卸载 EncoBar…」。移除系统应用及安装收据需要管理员授权，工具只清理当前用户的 EncoBar 数据。</p>
<p>macOS 自身的安装历史、系统日志不属于应用文件；卸载不会修改这些系统记录。</p></html>
