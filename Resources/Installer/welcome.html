<h1>安装 EncoBar</h1><p>为 OPPO Enco Air4 Pro 提供电量查看和降噪、通透切换。</p>
<p>应用将安装到 Mac 默认的「应用程序」文件夹：<b>/Applications/EncoBar.app</b>。安装需要管理员授权。</p>
<p>升级前请先退出 EncoBar。安装完成后，当前登录用户个人 Applications 文件夹中的已识别旧版会移至废纸篓，电量记录和偏好会保留。</p>
<p>首次运行时请允许蓝牙权限。不会添加开机启动项。</p>
<p>以后需要卸载时，打开耳机面板右上角「…」，选择「卸载 EncoBar…」，即可清理本应用的数据。</p></html>
